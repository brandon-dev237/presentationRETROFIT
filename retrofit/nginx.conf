server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (SPA) : toute route inconnue retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers statiques buildés par Vite : cache longue durée (noms hashés)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
