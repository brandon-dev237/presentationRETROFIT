# Environnement de développement RetroFit : backend Express + frontend Vite.
# La base de données (MongoDB Atlas), Stripe et Cloudinary restent externes —
# rien à conteneuriser de ce côté, seulement les identifiants dans les .env.
#
# Démarrer : docker compose up
# Le code source est monté en volume : les modifications sont reprises à chaud
# (nodemon côté backend, HMR Vite côté frontend), comme en local.

services:
  backend:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build: ./retrofit
    ports:
      - "5173:5173"
    env_file:
      - ./retrofit/.env
    environment:
      # Depuis le conteneur frontend, "backend" est le nom du service Docker
      # (résolu automatiquement sur le réseau Compose) — voir vite.config.js.
      - API_PROXY_TARGET=http://backend:4000
    volumes:
      - ./retrofit:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
